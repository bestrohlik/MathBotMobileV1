name: Build MathBot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Nastavit Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Instalace Buildozeru
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Nastavit Buildozer licence
        run: |
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: Sestavit APK
        run: |
          buildozer android debug

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: MathBot-APK
          path: bin/*.apk
