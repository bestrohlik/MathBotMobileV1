name: Build MathBot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Nastavit Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Instalace Buildozeru
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Zkontrolovat Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list | head -50
          find "$ANDROID_HOME" -name aidl -type f

      - name: Sestavit APK
        run: |
          buildozer android debug

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: MathBot-APK
          path: bin/*.apk
