name: Build MathBot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Instalace Buildozeru
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Nastavení Buildozer licence
        run: |
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: Stažení Android SDK a nástrojů
        run: |
          buildozer android p4a -- --help

      - name: Sestavení MathBot APK
        run: |
          buildozer android debug

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: MathBot-APK
          path: bin/*.apk
